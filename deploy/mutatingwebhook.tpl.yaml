apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: ${MUTATING_WH_CONFIG}
  labels:
    app: ${MUTATING_WH_CONFIG}
  annotations:
    # cert-manager injects the CA bundle from the Secret produced by
    # the matching Certificate resource. Format: <namespace>/<certificate-name>.
    cert-manager.io/inject-ca-from: ${NAMESPACE}/${WH_DEP}
webhooks:
- name: mutating.lxcfs-admission-webhook.io
  admissionReviewVersions: [ "v1" ]
  sideEffects: None
  timeoutSeconds: 5
  failurePolicy: Ignore
  clientConfig:
    service:
      name: ${WH_SVC}
      namespace: ${NAMESPACE}
      path: "/mutate"
    # caBundle is populated automatically by cert-manager via the
    # cert-manager.io/inject-ca-from annotation above.
  rules:
  - apiGroups: [ "" ]
    apiVersions: [ "v1" ]
    operations: [ "CREATE" ]
    resources: [ "pods" ]
    scope: "Namespaced"
  namespaceSelector:
    matchLabels:
      lxcfs-admission-webhook: enabled
