name: Publish Helm chart

on:
  push:
    branches: [ main ]
    paths:
      - 'charts/**'
      - '.github/workflows/chart-publish.yml'
    tags:
      - 'chart-v*.*.*'
  pull_request:
    paths:
      - 'charts/**'
      - '.github/workflows/chart-publish.yml'
  workflow_dispatch:

# After the first publish, set the chart's GHCR package visibility to
# "Public" once via the GitHub Packages UI (or via:
#   gh api -X PATCH /user/packages/container/charts%2Flxcfs-admission-webhook/visibility -f visibility=public
# ) so unauthenticated `helm pull oci://...` works.

env:
  REGISTRY: ghcr.io
  CHART_PATH: charts/lxcfs-admission-webhook

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Match the renderer that actually installs this chart: Argo CD
      # v3.5.x bundles Helm 4.2.1, so lint/template with the same major.
      - uses: azure/setup-helm@v5
        with:
          version: v4.2.1

      - name: helm lint
        run: helm lint ${{ env.CHART_PATH }}

      - name: helm template (smoke render)
        run: |
          helm template ci ${{ env.CHART_PATH }} --namespace lxcfs > /tmp/rendered.yaml
          echo "Rendered $(grep -c '^kind:' /tmp/rendered.yaml) resources, $(wc -l < /tmp/rendered.yaml) lines"

      - name: kubeconform validate
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C /tmp kubeconform
          /tmp/kubeconform -strict -ignore-missing-schemas \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{ .Group }}/{{ .ResourceKind }}_{{ .ResourceAPIVersion }}.json' \
            /tmp/rendered.yaml

  publish:
    needs: lint
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v7

      # Match the renderer that actually installs this chart: Argo CD
      # v3.5.x bundles Helm 4.2.1, so lint/template with the same major.
      - uses: azure/setup-helm@v5
        with:
          version: v4.2.1

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      # Both helm push and `cosign sign` need to authenticate to GHCR.
      # docker/login-action writes the docker config that cosign reads;
      # `helm registry login` writes Helm's separate registry config.
      - name: Log in to ${{ env.REGISTRY }} (Docker config, used by cosign)
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to ${{ env.REGISTRY }} (Helm registry config, used by helm push)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Resolve chart version
        id: chartver
        run: |
          version=$(helm show chart ${{ env.CHART_PATH }} | awk '/^version:/ {print $2}')
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Resolved chart version: ${version}"

      # OCI chart tags are treated as immutable handles the same way the
      # lxcfs image tags are. Refuse to republish a version that already
      # exists in GHCR instead of silently overwriting its digest -- bump
      # Chart.yaml's version instead.
      - name: Guard against re-publishing an existing chart version
        run: |
          version="${{ steps.chartver.outputs.version }}"
          ref="oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts/lxcfs-admission-webhook"
          if helm show chart "${ref}" --version "${version}" >/dev/null 2>&1; then
            echo "::error::chart version ${version} is already published at ${ref}. Bump Chart.yaml's version before publishing again." >&2
            exit 1
          fi

      - name: Package chart
        run: |
          mkdir -p /tmp/chartout
          helm package ${{ env.CHART_PATH }} -d /tmp/chartout

      - name: Push chart to OCI
        id: push
        run: |
          out=$(helm push "/tmp/chartout/lxcfs-admission-webhook-${{ steps.chartver.outputs.version }}.tgz" \
            "oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts" 2>&1 | tee /dev/stderr)
          digest=$(echo "$out" | awk '/Digest:/ {print $2}')
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart with cosign
        if: steps.push.outputs.digest != ''
        run: |
          cosign sign --yes \
            "${{ env.REGISTRY }}/${{ github.repository_owner }}/charts/lxcfs-admission-webhook@${{ steps.push.outputs.digest }}"
