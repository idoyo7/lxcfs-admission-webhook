apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: {{ include "lxcfs-admission-webhook.fullname" . }}
  labels:
    {{- include "lxcfs-admission-webhook.labels" . | nindent 4 }}
    app: {{ include "lxcfs-admission-webhook.fullname" . }}
  annotations:
    # cert-manager injects the CA bundle from the Secret produced by
    # the matching Certificate resource. Format: <namespace>/<certificate-name>.
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/{{ include "lxcfs-admission-webhook.fullname" . }}
webhooks:
  - name: mutating.lxcfs-admission-webhook.io
    admissionReviewVersions:
      - v1
    sideEffects: {{ .Values.mutatingWebhook.sideEffects }}
    timeoutSeconds: {{ .Values.mutatingWebhook.timeoutSeconds }}
    failurePolicy: {{ .Values.mutatingWebhook.failurePolicy }}
    reinvocationPolicy: {{ .Values.mutatingWebhook.reinvocationPolicy }}
    clientConfig:
      service:
        name: {{ include "lxcfs-admission-webhook.fullname" . }}
        namespace: {{ .Release.Namespace }}
        path: /mutate
      # caBundle is populated automatically by cert-manager via the
      # cert-manager.io/inject-ca-from annotation above.
    rules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
        resources:
          - pods
        scope: Namespaced
    namespaceSelector:
      {{- toYaml .Values.mutatingWebhook.namespaceSelector | nindent 6 }}
    {{- with .Values.mutatingWebhook.objectSelector }}
    objectSelector:
      {{- toYaml . | nindent 6 }}
    {{- end }}
