# -- Override the chart name
nameOverride: ""
# -- Override the fully qualified app name
fullnameOverride: ""

# Webhook configuration
webhook:
  # -- Component suffix for the webhook resources. Final names become
  # `{releaseName}-{componentName}` (e.g. release `lxcfs` => `lxcfs-controller`).
  componentName: controller
  image:
    repository: ghcr.io/idoyo7/lxcfs-admission-webhook
    # -- Image tag. Defaults to chart appVersion.
    tag: ""
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  replicas: 2
  port: 8443
  args:
    - -tlsCertFile=/etc/webhook/certs/tls.crt
    - -tlsKeyFile=/etc/webhook/certs/tls.key
    - -alsologtostderr
    - -v=4
  resources:
    limits:
      cpu: "1"
      memory: 1Gi
    requests: {}
  podAnnotations:
    mutating.lxcfs-admission-webhook.io/enable: "false"
  # -- Affinity / nodeSelector / tolerations applied to the webhook Deployment
  affinity: {}
  nodeSelector: {}
  tolerations: []

# LXCFS DaemonSet configuration
lxcfs:
  # -- Component suffix for the LXCFS DaemonSet. Final name becomes
  # `{releaseName}-{componentName}` (e.g. release `lxcfs` => `lxcfs-daemonset`).
  componentName: daemonset
  # -- Args passed to the lxcfs binary inside the container. Override
  # this list to enable new flags (e.g. --enable-psi-poll)
  # that ship in a newer LXCFS release when you bump `lxcfs.image.tag`.
  args:
    - --foreground
    - --enable-loadavg
    - --enable-cfs
  image:
    repository: ghcr.io/idoyo7/lxcfs
    # renovate: datasource=github-releases depName=lxc/lxcfs extractVersion=^v(?<version>.*)$
    tag: 7.0.0-3
    pullPolicy: Always
  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests: {}
  # -- Readiness for the LXCFS DaemonSet Pod. The probe reads a
  # cpuview-backed file *through* the mount, so "Ready" means the mount
  # serves rather than "the daemon started" — during the 7.0.0 incident a
  # Pod reported `1/1 Running` on a node where every such read hung
  # forever, and the roll proceeded to the next node. Combined with
  # `updateStrategy.rollingUpdate.maxUnavailable`, a failing probe stops
  # the roll instead of spreading it.
  #
  # The defaults are deliberately slack against a slow node: a healthy read
  # costs microseconds of CPU, so `timeoutSeconds: 5` is ~4 orders of
  # magnitude of headroom, and `failureThreshold: 3` needs three
  # consecutive failures — a wedged mount is reported NotReady after
  # roughly `initialDelay + failureThreshold × period` = 35s. Measured
  # healthy start-up on an idle node is ~0.2s from container start to the
  # mount answering.
  #
  # `timeoutSeconds` is also the ceiling for the script's own read
  # deadline, which the chart sets to `max(1, this - 2)` so the script
  # always returns before kubelet kills it.
  readinessProbe:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  # -- Rolling update policy for the DaemonSet. Spelled out rather than
  # left to the API default because it is what makes the readinessProbe a
  # brake: with `maxUnavailable: 1` the controller will not replace the
  # next node's Pod until this one is Ready.
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  # -- Host path used to expose LXCFS state to other Pods on the node
  hostPath: /var/lib/lxc
  # -- Termination grace period for the DaemonSet Pod. The preStop hook
  # unmounts the in-container bind mounts and then tears down the
  # canonical FUSE mount at `{hostPath}/lxcfs`, and kubelet SIGKILLs
  # whatever is still running when this window closes. The script's total
  # budget is derived from this value as `max(5, this - 15)` seconds and
  # passed in as `LXCFS_UMOUNT_BUDGET`, so the two cannot drift. 30 (the
  # Kubernetes default, and what this chart used before 0.4.0) is not
  # enough on a node with many mutated Pods -- see MIGRATION.md.
  #
  # The postStart gate added in 0.4.2 is derived from the same value as
  # `max(10, this - 15)` and passed in as `LXCFS_MOUNT_READY_TIMEOUT`.
  # Start-up and termination are different phases and never overlap for
  # one container, except when a delete lands while the gate is still
  # open; `45 + 13` (the teardown's mandatory rungs) `= 58 <= 60` keeps
  # even that inside one grace period. Arithmetic in MIGRATION.md.
  terminationGracePeriodSeconds: 60
  podAnnotations:
    mutating.lxcfs-admission-webhook.io/enable: "false"
  # -- Tolerations applied to the LXCFS DaemonSet (default tolerates control-plane)
  tolerations:
    - key: node-role.kubernetes.io/master
      effect: NoSchedule
    - key: node-role.kubernetes.io/control-plane
      effect: NoSchedule
  # -- Node affinity restricting LXCFS to linux nodes
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/os
                operator: In
                values:
                  - linux
  nodeSelector: {}

# cert-manager managed serving certificate.
# Both CA and serving cert default to ~100 years. Rationale:
#   - The cert is private (only kube-apiserver dials this Service);
#     it never traverses the public internet, so the 398-day rule for
#     publicly-trusted CAs does not apply.
#   - The webhook Deployment loads the cert at startup and does not
#     watch the Secret for rotations. A short-lived cert that gets
#     rotated by cert-manager would not be picked up until a Pod
#     restart, leading to silent mTLS failure once the in-memory cert
#     expires. A 100y cert sidesteps the reload gap entirely.
#   - Tighten these values if your security policy requires shorter
#     rotation; combine with an operator like stakater/Reloader to
#     restart the Deployment on Secret changes.
certificate:
  ca:
    duration: 876000h
    privateKey:
      algorithm: RSA
      size: 4096
  serving:
    duration: 876000h
    # Renew well before expiry. Mostly symbolic at 100y duration.
    renewBefore: 720h
    privateKey:
      algorithm: RSA
      size: 2048

# MutatingWebhookConfiguration
mutatingWebhook:
  failurePolicy: Ignore
  timeoutSeconds: 5
  sideEffects: None
  reinvocationPolicy: Never
  # -- Only mutate Pods in namespaces carrying this label
  namespaceSelector:
    matchLabels:
      lxcfs-admission-webhook: enabled
  # -- Optional objectSelector for finer control
  objectSelector: {}
