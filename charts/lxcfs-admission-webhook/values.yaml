# -- Override the chart name
nameOverride: ""
# -- Override the fully qualified app name
fullnameOverride: ""

# Webhook configuration
webhook:
  # -- Component suffix for the webhook resources. Final names become
  # `{releaseName}-{componentName}` (e.g. release `lxcfs` => `lxcfs-controller`).
  componentName: controller
  image:
    repository: ghcr.io/idoyo7/lxcfs-admission-webhook
    # -- Image tag. Defaults to chart appVersion.
    tag: ""
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  replicas: 2
  port: 8443
  args:
    - -tlsCertFile=/etc/webhook/certs/tls.crt
    - -tlsKeyFile=/etc/webhook/certs/tls.key
    - -alsologtostderr
    - -v=4
  resources:
    limits:
      cpu: "1"
      memory: 1Gi
    requests: {}
  podAnnotations:
    mutating.lxcfs-admission-webhook.io/enable: "false"
  # -- Affinity / nodeSelector / tolerations applied to the webhook Deployment
  affinity: {}
  nodeSelector: {}
  tolerations: []

# LXCFS DaemonSet configuration
lxcfs:
  # -- Component suffix for the LXCFS DaemonSet. Final name becomes
  # `{releaseName}-{componentName}` (e.g. release `lxcfs` => `lxcfs-daemonset`).
  componentName: daemonset
  # -- Args passed to the lxcfs binary inside the container. Override
  # this list to enable new flags (e.g. --enable-psi-poll)
  # that ship in a newer LXCFS release when you bump `lxcfs.image.tag`.
  args:
    - --foreground
    - --enable-loadavg
    - --enable-cfs
  image:
    repository: ghcr.io/idoyo7/lxcfs
    # renovate: datasource=github-releases depName=lxc/lxcfs extractVersion=^v(?<version>.*)$
    tag: 7.0.0-1
    pullPolicy: Always
  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests: {}
  # -- Host path used to expose LXCFS state to other Pods on the node
  hostPath: /var/lib/lxc
  podAnnotations:
    mutating.lxcfs-admission-webhook.io/enable: "false"
  # -- Tolerations applied to the LXCFS DaemonSet (default tolerates control-plane)
  tolerations:
    - key: node-role.kubernetes.io/master
      effect: NoSchedule
    - key: node-role.kubernetes.io/control-plane
      effect: NoSchedule
  # -- Node affinity restricting LXCFS to linux nodes
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/os
                operator: In
                values:
                  - linux
  nodeSelector: {}

# cert-manager managed serving certificate.
# Both CA and serving cert default to ~100 years. Rationale:
#   - The cert is private (only kube-apiserver dials this Service);
#     it never traverses the public internet, so the 398-day rule for
#     publicly-trusted CAs does not apply.
#   - The webhook Deployment loads the cert at startup and does not
#     watch the Secret for rotations. A short-lived cert that gets
#     rotated by cert-manager would not be picked up until a Pod
#     restart, leading to silent mTLS failure once the in-memory cert
#     expires. A 100y cert sidesteps the reload gap entirely.
#   - Tighten these values if your security policy requires shorter
#     rotation; combine with an operator like stakater/Reloader to
#     restart the Deployment on Secret changes.
certificate:
  ca:
    duration: 876000h
    privateKey:
      algorithm: RSA
      size: 4096
  serving:
    duration: 876000h
    # Renew well before expiry. Mostly symbolic at 100y duration.
    renewBefore: 720h
    privateKey:
      algorithm: RSA
      size: 2048

# MutatingWebhookConfiguration
mutatingWebhook:
  failurePolicy: Ignore
  timeoutSeconds: 5
  sideEffects: None
  reinvocationPolicy: Never
  # -- Only mutate Pods in namespaces carrying this label
  namespaceSelector:
    matchLabels:
      lxcfs-admission-webhook: enabled
  # -- Optional objectSelector for finer control
  objectSelector: {}
