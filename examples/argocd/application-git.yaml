# ALTERNATIVE: ArgoCD Application pointing at the chart sources in
# this repository directly. Use only for ad-hoc test installs or for
# tracking unreleased chart changes — for production, prefer
# application-oci.yaml so the chart you sync from is a versioned,
# signed OCI artifact rather than a moving git ref.
#
# Apply this manifest into your ArgoCD-managed GitOps repository,
# NOT into this repo.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lxcfs-admission-webhook
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/idoyo7/lxcfs-admission-webhook.git
    path: charts/lxcfs-admission-webhook
    targetRevision: main          # pin to a tag or commit for stability
    helm:
      releaseName: lxcfs-admission-webhook
      values: |
        webhook:
          image:
            repository: ghcr.io/idoyo7/lxcfs-admission-webhook
            tag: latest
          replicas: 2
        lxcfs:
          image:
            repository: ghcr.io/idoyo7/lxcfs
            tag: 7.0.0
        mutatingWebhook:
          failurePolicy: Ignore
          namespaceSelector:
            matchLabels:
              lxcfs-admission-webhook: enabled

  destination:
    server: https://kubernetes.default.svc
    namespace: lxcfs

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jsonPointers:
        - /webhooks/0/clientConfig/caBundle
