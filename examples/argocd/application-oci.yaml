# RECOMMENDED: ArgoCD Application that pulls the chart from GHCR as
# an OCI artifact. This keeps GitOps separation clean — the chart
# lives in the project's release registry, not inside your GitOps
# repo.
#
# Apply this manifest into your ArgoCD-managed GitOps repository
# (e.g. infra-config.git/environments/prod/), NOT into this repo.
#
# Prerequisites in the target cluster:
#   - ArgoCD v2.6+ (OCI Helm support is generally available)
#   - cert-manager v1.x
#   - Nodes with fuse3 available
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lxcfs-admission-webhook
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    # OCI Helm chart published by the project's CI on every chart bump.
    repoURL: ghcr.io/idoyo7/charts
    chart: lxcfs-admission-webhook
    targetRevision: 0.1.0   # bump in lockstep with chart releases
    helm:
      releaseName: lxcfs-admission-webhook
      values: |
        webhook:
          image:
            repository: ghcr.io/idoyo7/lxcfs-admission-webhook
            tag: latest          # or a pinned semver tag
          replicas: 2
        lxcfs:
          image:
            repository: ghcr.io/idoyo7/lxcfs
            tag: 6.0.1-r0
        mutatingWebhook:
          failurePolicy: Ignore  # flip to Fail once you trust it
          namespaceSelector:
            matchLabels:
              lxcfs-admission-webhook: enabled

  destination:
    server: https://kubernetes.default.svc
    namespace: lxcfs

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m

  # Lock CI churn — these fields are managed at runtime by the cluster
  # and ArgoCD should not flag them as drift.
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jsonPointers:
        - /webhooks/0/clientConfig/caBundle  # injected by cert-manager
